[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [{ name = "hdgiacon", email = "hectordorrighello@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.121.3,<0.122.0)",
    "pygithub (>=2.8.1,<3.0.0)",
    "pymupdf (>=1.26.6,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "langchain (>=1.0.8,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-huggingface (>=1.0.1,<2.0.0)",
    "chromadb (>=1.3.5,<2.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.group.dev.dependencies]
pytest-mock = "^3.15.1"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["test"]
